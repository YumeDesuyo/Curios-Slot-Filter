modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
clientSideOnly=true
displayURL="https://github.com/YumeDesuyo/Curios-Slot-Finder"
issueTrackerURL="https://github.com/YumeDesuyo/Curios-Slot-Finder/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayTest="IGNORE_ALL_VERSION"
logoFile="icon.png"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="curios"
mandatory=true
versionRange="[5.9.0,6.0.0)"
ordering="AFTER"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="jei"
mandatory=true
versionRange="[15.59.0,16.0.0)"
ordering="AFTER"
side="CLIENT"
